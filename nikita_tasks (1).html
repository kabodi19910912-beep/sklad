<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задачи — Никита & Павел</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F4F1EC;
    --card: #FDFCFA;
    --text: #1A1814;
    --muted: #7A7670;
    --border: rgba(26,24,20,0.1);
    --border-strong: rgba(26,24,20,0.18);
    --red: #C8392B;
    --red-bg: #FDF0EE;
    --amber: #B06000;
    --amber-bg: #FEF6E7;
    --green: #2F7A3B;
    --green-bg: #EDF6EE;
    --done-text: #BFBAB4;

    --nikita: #1A1814;
    --nikita-light: #3A3530;
    --pavel: #1E3A5F;
    --pavel-light: #2C5282;
    --pavel-bg: #EBF2FA;
  }

  body {
    font-family: 'Golos Text', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── TOP HEADER ── */
  .top-header {
    background: #1A1814;
    padding: 1.5rem 2rem 0;
  }

  .top-header h1 {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(0.95rem, 2.5vw, 1.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #F4F1EC;
  }

  .top-header h1 span { color: #C8B89A; }

  .header-sub {
    font-size: 0.78rem;
    color: #9A9490;
    margin-top: 4px;
  }

  /* ── SELLER TABS ── */
  .seller-tabs {
    display: flex;
    gap: 0;
    margin-top: 1.25rem;
  }

  .seller-tab {
    flex: 1;
    padding: 12px 20px 14px;
    cursor: pointer;
    border: none;
    font-family: 'Unbounded', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.05);
    color: #9A9490;
    transition: all 0.18s;
    border-radius: 10px 10px 0 0;
    position: relative;
    top: 1px;
  }

  .seller-tab:hover { color: #D0C9C0; background: rgba(255,255,255,0.08); }

  .seller-tab.active-nikita {
    background: var(--bg);
    color: var(--nikita);
    border-bottom: 3px solid var(--nikita);
  }

  .seller-tab.active-pavel {
    background: var(--bg);
    color: var(--pavel);
    border-bottom: 3px solid var(--pavel);
  }

  .tab-stats {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }

  .tab-stat {
    font-family: 'Golos Text', sans-serif;
    font-size: 0.68rem;
    color: #7A8FA6;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
  }

  .tab-stat-val { font-weight: 600; }

  /* ── SELLER PANEL ── */
  .seller-panel { display: none; }
  .seller-panel.active { display: block; }

  /* ── PANEL BANNER ── */
  .panel-banner {
    padding: 1rem 2rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .banner-nikita { background: var(--bg); border-bottom: 1px solid var(--border); }
  .banner-pavel  { background: var(--pavel-bg); border-bottom: 1px solid rgba(30,58,95,0.12); }

  .banner-name {
    font-family: 'Unbounded', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .banner-nikita .banner-name { color: var(--nikita); }
  .banner-pavel  .banner-name { color: var(--pavel); }

  .mini-stats { display: flex; gap: 16px; }

  .mini-stat { text-align: center; }

  .mini-val {
    font-family: 'Unbounded', sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
  }

  .banner-nikita .mini-val { color: var(--nikita); }
  .banner-pavel  .mini-val { color: var(--pavel); }

  .mini-lbl { font-size: 0.68rem; color: var(--muted); margin-top: 1px; }

  .progress-bar {
    flex: 1;
    min-width: 120px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .banner-nikita .progress-fill { background: var(--nikita); }
  .banner-pavel  .progress-fill { background: var(--pavel); }

  /* ── MAIN CONTENT ── */
  .main {
    max-width: 760px;
    margin: 0 auto;
    padding: 1.25rem 1rem 4rem;
  }

  /* ── ADD FORM ── */
  .add-form {
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .add-form input[type="text"] {
    flex: 1;
    min-width: 180px;
    font-family: 'Golos Text', sans-serif;
    font-size: 0.9rem;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 9px 12px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .add-form input[type="date"] {
    font-family: 'Golos Text', sans-serif;
    font-size: 0.85rem;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 9px 10px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    width: 148px;
  }

  .add-form select {
    font-family: 'Golos Text', sans-serif;
    font-size: 0.85rem;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 9px 10px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    cursor: pointer;
    width: 140px;
  }

  .btn-add {
    font-family: 'Golos Text', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s, transform 0.1s;
    color: #F4F1EC;
  }

  .btn-nikita { background: var(--nikita); }
  .btn-pavel  { background: var(--pavel); }
  .btn-add:hover { opacity: 0.85; }
  .btn-add:active { transform: scale(0.97); }

  /* ── SECTIONS ── */
  .section { margin-bottom: 1.75rem; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .section-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-high { background: var(--red); }
  .dot-mid  { background: var(--amber); }
  .dot-low  { background: var(--green); }
  .dot-done { background: #BFBAB4; }

  .section-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .section-count {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--muted);
    background: var(--border);
    border-radius: 20px;
    padding: 2px 8px;
  }

  .task-list { display: flex; flex-direction: column; gap: 6px; }

  /* ── TASK ── */
  .task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    transition: border-color 0.15s, opacity 0.2s;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .task:hover { border-color: var(--border-strong); }
  .task.done  { opacity: 0.45; }

  .task-cb {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    flex-shrink: 0;
    margin-top: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
    background: transparent;
  }

  .task-cb:hover { background: var(--bg); }

  .task-cb.checked-nikita { background: var(--nikita); border-color: var(--nikita); }
  .task-cb.checked-pavel  { background: var(--pavel);  border-color: var(--pavel);  }

  .task-cb.checked-nikita::after,
  .task-cb.checked-pavel::after {
    content: '';
    width: 9px; height: 5px;
    border-left: 2px solid #F4F1EC;
    border-bottom: 2px solid #F4F1EC;
    transform: rotate(-45deg) translateY(-1px);
    display: block;
  }

  .task-body { flex: 1; min-width: 0; }

  .task-text {
    font-size: 0.88rem;
    line-height: 1.45;
    color: var(--text);
    word-break: break-word;
  }

  .task.done .task-text {
    text-decoration: line-through;
    color: var(--done-text);
  }

  .task-footer {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 5px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 0.68rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
  }

  .badge-high { background: var(--red-bg);   color: var(--red);   }
  .badge-mid  { background: var(--amber-bg); color: var(--amber); }
  .badge-low  { background: var(--green-bg); color: var(--green); }

  .task-date { font-size: 0.72rem; color: var(--muted); }
  .task-date.overdue { color: var(--red); font-weight: 600; }

  .del-btn {
    background: none; border: none; cursor: pointer;
    color: var(--muted); opacity: 0;
    font-size: 0.85rem; line-height: 1;
    padding: 2px 4px; border-radius: 4px;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0; margin-left: auto; align-self: center;
  }

  .task:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: var(--red); }

  .empty-msg {
    font-size: 0.8rem; color: var(--done-text);
    padding: 6px 2px; font-style: italic;
  }

  @media (max-width: 520px) {
    .top-header { padding: 1.25rem 1rem 0; }
    .panel-banner { padding: 0.75rem 1rem 1rem; gap: 1rem; }
    .seller-tab { padding: 10px 12px 12px; }
  }
</style>
</head>
<body>

<div class="top-header">
  <h1>Задачи <span>/ селлеры</span></h1>
  <div class="header-sub" id="header-date"></div>
  <div class="seller-tabs">
    <button class="seller-tab active-nikita" id="tab-nikita" onclick="switchSeller('nikita')">
      Никита
      <div class="tab-stats">
        <span class="tab-stat"><span class="tab-stat-val" id="tn-open">0</span> открытых</span>
        <span class="tab-stat"><span class="tab-stat-val" id="tn-pct">0%</span> готово</span>
      </div>
    </button>
    <button class="seller-tab" id="tab-pavel" onclick="switchSeller('pavel')">
      Павел
      <div class="tab-stats">
        <span class="tab-stat"><span class="tab-stat-val" id="tp-open">0</span> открытых</span>
        <span class="tab-stat"><span class="tab-stat-val" id="tp-pct">0%</span> готово</span>
      </div>
    </button>
  </div>
</div>

<!-- ═══ НИКИТА ═══ -->
<div class="seller-panel active" id="panel-nikita">
  <div class="panel-banner banner-nikita">
    <div class="banner-name">Никита</div>
    <div class="mini-stats">
      <div class="mini-stat"><div class="mini-val" id="n-all">0</div><div class="mini-lbl">всего</div></div>
      <div class="mini-stat"><div class="mini-val" id="n-done">0</div><div class="mini-lbl">готово</div></div>
      <div class="mini-stat"><div class="mini-val" id="n-high">0</div><div class="mini-lbl">срочных</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="n-prog" style="width:0%"></div></div>
  </div>

  <div class="main">
    <div class="add-form">
      <input type="text" id="n-inp-text" placeholder="Новая задача Никиты..." />
      <input type="date" id="n-inp-date" />
      <select id="n-inp-pri">
        <option value="high">🔴 срочно</option>
        <option value="mid" selected>🟡 нормально</option>
        <option value="low">🟢 не горит</option>
      </select>
      <button class="btn-add btn-nikita" onclick="addTask('nikita')">+ добавить</button>
    </div>

    <div class="section"><div class="section-header"><div class="section-dot dot-high"></div><div class="section-title">Срочно</div><div class="section-count" id="n-cnt-high">0</div></div><div class="task-list" id="n-list-high"></div></div>
    <div class="section"><div class="section-header"><div class="section-dot dot-mid"></div><div class="section-title">В работе</div><div class="section-count" id="n-cnt-mid">0</div></div><div class="task-list" id="n-list-mid"></div></div>
    <div class="section"><div class="section-header"><div class="section-dot dot-low"></div><div class="section-title">Не горит</div><div class="section-count" id="n-cnt-low">0</div></div><div class="task-list" id="n-list-low"></div></div>
    <div class="section"><div class="section-header"><div class="section-dot dot-done"></div><div class="section-title">Выполнено</div><div class="section-count" id="n-cnt-done">0</div></div><div class="task-list" id="n-list-done"></div></div>
  </div>
</div>

<!-- ═══ ПАВЕЛ ═══ -->
<div class="seller-panel" id="panel-pavel">
  <div class="panel-banner banner-pavel">
    <div class="banner-name">Павел</div>
    <div class="mini-stats">
      <div class="mini-stat"><div class="mini-val" id="p-all">0</div><div class="mini-lbl">всего</div></div>
      <div class="mini-stat"><div class="mini-val" id="p-done">0</div><div class="mini-lbl">готово</div></div>
      <div class="mini-stat"><div class="mini-val" id="p-high">0</div><div class="mini-lbl">срочных</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="p-prog" style="width:0%"></div></div>
  </div>

  <div class="main">
    <div class="add-form">
      <input type="text" id="p-inp-text" placeholder="Новая задача Павла..." />
      <input type="date" id="p-inp-date" />
      <select id="p-inp-pri">
        <option value="high">🔴 срочно</option>
        <option value="mid" selected>🟡 нормально</option>
        <option value="low">🟢 не горит</option>
      </select>
      <button class="btn-add btn-pavel" onclick="addTask('pavel')">+ добавить</button>
    </div>

    <div class="section"><div class="section-header"><div class="section-dot dot-high"></div><div class="section-title">Срочно</div><div class="section-count" id="p-cnt-high">0</div></div><div class="task-list" id="p-list-high"></div></div>
    <div class="section"><div class="section-header"><div class="section-dot dot-mid"></div><div class="section-title">В работе</div><div class="section-count" id="p-cnt-mid">0</div></div><div class="task-list" id="p-list-mid"></div></div>
    <div class="section"><div class="section-header"><div class="section-dot dot-low"></div><div class="section-title">Не горит</div><div class="section-count" id="p-cnt-low">0</div></div><div class="task-list" id="p-list-low"></div></div>
    <div class="section"><div class="section-header"><div class="section-dot dot-done"></div><div class="section-title">Выполнено</div><div class="section-count" id="p-cnt-done">0</div></div><div class="task-list" id="p-list-done"></div></div>
  </div>
</div>

<script>
const INITIAL_NIKITA = [
  { id:1,  text:"добавить слайды на пергамент",                            pri:"high", date:"", done:false },
  { id:2,  text:"узнать замеры тендерайзера",                              pri:"high", date:"", done:false },
  { id:3,  text:"сделать поставку на крючки (после статуса супер)",         pri:"high", date:"", done:false },
  { id:4,  text:"молотки новые — проверить все ли кластера довезли",        pri:"high", date:"", done:false },
  { id:5,  text:"переделать инфографику на коврик для посуды",              pri:"mid",  date:"", done:false },
  { id:6,  text:"Наде отправить на переделку — шпатели 16×16, форма по низу", pri:"mid", date:"", done:false },
  { id:7,  text:"замеры мешки со шпателями — раздать 5 шт",                pri:"mid",  date:"", done:false },
  { id:8,  text:"вентиляторы — переделать инфографику",                    pri:"mid",  date:"", done:false },
  { id:9,  text:"шахматный коврик — переделать интерьер",                  pri:"mid",  date:"", done:false },
  { id:10, text:"вести учёт первой поставки товара",                       pri:"mid",  date:"", done:false },
  { id:11, text:"фото Дианы Бакаевой — добавить размер",                   pri:"mid",  date:"", done:false },
  { id:12, text:"фото Дианы Бакаевой — сделать главную",                   pri:"mid",  date:"", done:false },
  { id:13, text:"органайзеры для косметики — поднять цену когда < 200 шт", pri:"low",  date:"", done:false },
  { id:14, text:"молотки — дать ОС когда разъедутся",                     pri:"low",  date:"", done:false },
  { id:15, text:"крючки — согласовать поставку когда статус супер",        pri:"low",  date:"", done:false },
  { id:16, text:"органайзеры — добавление секций",                         pri:"low",  date:"", done:false },
  { id:17, text:"резинки 50% кеш — 5 штук раздачи",                       pri:"low",  date:"", done:false },
];

const INITIAL_PAVEL = [
  { id:101, text:"сделать инфографику на вентилятор чёрный",               pri:"high", date:"", done:false },
  { id:102, text:"сделать инфографику на измельчитель",                    pri:"high", date:"", done:false },
  { id:103, text:"сделать выкупы на вентилятор чёрный",                    pri:"high", date:"", done:false },
  { id:104, text:"сделать выкупы на фигурный измельчитель бежевый",        pri:"high", date:"", done:false },
  { id:105, text:"переделать инфографику на синий измельчитель (как будет соинвест)", pri:"low", date:"", done:false },
  { id:106, text:"попробовать изменить заглавное на белый",                 pri:"low",  date:"", done:false },
];

const state = {
  nikita: { tasks: [], nextId: 18 },
  pavel:  { tasks: [], nextId: 107 },
};

function load() {
  try {
    const sn = localStorage.getItem('tasks-nikita-v1');
    const sp = localStorage.getItem('tasks-pavel-v1');
    if (sn) { state.nikita.tasks = JSON.parse(sn); state.nikita.nextId = Math.max(...state.nikita.tasks.map(t=>t.id),17)+1; }
    else    { state.nikita.tasks = INITIAL_NIKITA.map(t=>({...t})); }
    if (sp) { state.pavel.tasks  = JSON.parse(sp);  state.pavel.nextId  = Math.max(...state.pavel.tasks.map(t=>t.id),106)+1; }
    else    { state.pavel.tasks  = INITIAL_PAVEL.map(t=>({...t})); }
  } catch(e) {
    state.nikita.tasks = INITIAL_NIKITA.map(t=>({...t}));
    state.pavel.tasks  = INITIAL_PAVEL.map(t=>({...t}));
  }
}

function save(seller) {
  try { localStorage.setItem('tasks-'+seller+'-v1', JSON.stringify(state[seller].tasks)); } catch(e) {}
}

function fmtDate(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}.${m}.${y.slice(2)}`;
}

function isOverdue(d) {
  if (!d) return false;
  return new Date(d) < new Date(new Date().toDateString());
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function taskHTML(t, seller) {
  const labels = { high:'срочно', mid:'в работе', low:'не горит' };
  const dateStr = t.date ? fmtDate(t.date) : '';
  const over = !t.done && isOverdue(t.date);
  const cbClass = t.done ? `checked-${seller}` : '';
  return `
  <div class="task${t.done?' done':''}" id="task-${seller}-${t.id}">
    <div class="task-cb ${cbClass}" onclick="toggle('${seller}',${t.id})" title="${t.done?'Снять отметку':'Выполнено'}"></div>
    <div class="task-body">
      <div class="task-text">${escHtml(t.text)}</div>
      <div class="task-footer">
        ${!t.done?`<span class="badge badge-${t.pri}">${labels[t.pri]}</span>`:''}
        ${dateStr?`<span class="task-date${over?' overdue':''}">📅 ${dateStr}${over?' просрочено':''}</span>`:''}
      </div>
    </div>
    <button class="del-btn" onclick="del('${seller}',${t.id})" title="Удалить">✕</button>
  </div>`;
}

function render(seller) {
  const p = seller === 'nikita' ? 'n' : 'p';
  const tasks = state[seller].tasks;
  const buckets = { high:[], mid:[], low:[], done:[] };
  tasks.forEach(t => { if (t.done) buckets.done.push(t); else buckets[t.pri].push(t); });

  ['high','mid','low','done'].forEach(k => {
    const el = document.getElementById(`${p}-list-${k}`);
    const cnt = document.getElementById(`${p}-cnt-${k}`);
    if (!el) return;
    cnt.textContent = buckets[k].length;
    el.innerHTML = buckets[k].length === 0
      ? '<div class="empty-msg">нет задач</div>'
      : buckets[k].map(t => taskHTML(t, seller)).join('');
  });

  const total = tasks.length;
  const done  = tasks.filter(t=>t.done).length;
  const high  = tasks.filter(t=>t.pri==='high'&&!t.done).length;
  const pct   = total > 0 ? Math.round(done/total*100) : 0;

  document.getElementById(`${p}-all`).textContent  = total;
  document.getElementById(`${p}-done`).textContent = done;
  document.getElementById(`${p}-high`).textContent = high;
  document.getElementById(`${p}-prog`).style.width = pct+'%';

  // tab mini stats
  const openTasks = tasks.filter(t=>!t.done).length;
  if (seller==='nikita') {
    document.getElementById('tn-open').textContent = openTasks;
    document.getElementById('tn-pct').textContent  = pct+'%';
  } else {
    document.getElementById('tp-open').textContent = openTasks;
    document.getElementById('tp-pct').textContent  = pct+'%';
  }
}

function toggle(seller, id) {
  const t = state[seller].tasks.find(x=>x.id===id);
  if (t) { t.done = !t.done; save(seller); render(seller); }
}

function del(seller, id) {
  if (!confirm('Удалить задачу?')) return;
  state[seller].tasks = state[seller].tasks.filter(x=>x.id!==id);
  save(seller); render(seller);
}

function addTask(seller) {
  const p = seller==='nikita'?'n':'p';
  const text = document.getElementById(`${p}-inp-text`).value.trim();
  if (!text) { document.getElementById(`${p}-inp-text`).focus(); return; }
  state[seller].tasks.unshift({
    id: state[seller].nextId++,
    text,
    pri: document.getElementById(`${p}-inp-pri`).value,
    date: document.getElementById(`${p}-inp-date`).value,
    done: false
  });
  document.getElementById(`${p}-inp-text`).value = '';
  document.getElementById(`${p}-inp-date`).value = '';
  save(seller); render(seller);
}

['n-inp-text','p-inp-text'].forEach((id,i) => {
  const seller = i===0?'nikita':'pavel';
  document.getElementById(id).addEventListener('keydown', e => { if (e.key==='Enter') addTask(seller); });
});

let currentSeller = 'nikita';

function switchSeller(seller) {
  currentSeller = seller;
  document.querySelectorAll('.seller-panel').forEach(el => el.classList.remove('active'));
  document.getElementById('panel-'+seller).classList.add('active');
  ['nikita','pavel'].forEach(s => {
    const tab = document.getElementById('tab-'+s);
    tab.className = 'seller-tab';
    if (s===seller) tab.classList.add('active-'+s);
  });
}

const now = new Date();
const days = ['вс','пн','вт','ср','чт','пт','сб'];
const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
document.getElementById('header-date').textContent =
  `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

load();
render('nikita');
render('pavel');
</script>
